project:
  name: "IPL Prediction Model"
  version: "1.0.0"
  seasons_range: [2008, 2026]

paths:
  raw_data: "data/raw/IPL.csv"
  processed_dir: "data/processed"
  features_parquet: "data/processed/features.parquet"
  score_features_parquet: "data/processed/score_features.parquet"
  elo_csv: "data/processed/elo_ratings.csv"
  clusters_csv: "data/processed/clusters.csv"
  models_dir: "models"
  logs_dir: "logs"
  shap_npy: "data/processed/shap_values.npy"

elo:
  k_factor: 32
  initial_rating: 1500

team_aliases:
  "Delhi Daredevils": "Delhi Capitals"
  "Kings XI Punjab": "Punjab Kings"
  "Royal Challengers Bangalore": "Royal Challengers Bengaluru"
  "Deccan Chargers": "Sunrisers Hyderabad"
  "Rising Pune Supergiants": "Rising Pune Supergiant"

models:
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    random_state: 42
  rf:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 5
    random_state: 42
  adaboost:
    n_estimators: 100
    learning_rate: 0.1
  knn_ks: [3, 5, 7, 9, 11, 13, 15]
  ridge_alphas: [0.01, 0.1, 1, 10, 100]
  lasso_alphas: [0.001, 0.01, 0.1, 1, 10]

deep_learning:
  seq_len: 20
  n_seq_features: 5
  lstm:
    units_1: 128
    units_2: 64
    dropout: 0.3
    dense_units: 32
    lr: 0.001
    epochs: 30
    batch_size: 64
  gru:
    units_1: 128
    units_2: 64
    dropout: 0.3
    dense_units: 32
    lr: 0.001
    epochs: 30
    batch_size: 64
  transformer:
    d_model: 64
    num_heads: 4
    num_layers: 2
    dff: 128
    dropout: 0.1
    lr: 0.001
    epochs: 30
    batch_size: 64
  cnn:
    filters_1: 64
    filters_2: 128
    kernel_size: 3
    dropout: 0.3
    dense_units: 64
    lr: 0.001
    epochs: 30
    batch_size: 64
  autoencoder:
    encoding_dim: 32
    hidden_dim: 64
    dropout: 0.2
    lr: 0.001
    epochs: 50
    batch_size: 64

ui:
  primary_color: "#1F3864"
  accent_color: "#FF6B00"
  dl_accent: "#7C3AED"
  chart_height: 400

cv_folds: 5
random_seed: 42
